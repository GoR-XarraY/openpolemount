{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  <meta property="og:url" content="{{ page.canonical_url }}">
  <meta property="og:title" content="{{ page.title }} — OpenPoleMount">
  <meta property="og:description" content="{{ config.site_description }}">
  <meta property="og:image" content="https://openpolemount.com/images/iv-pole-v2/v2-og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="OpenPoleMount IV pole cradle v2 — 3D render">
  <meta property="og:site_name" content="OpenPoleMount">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://openpolemount.com/images/iv-pole-v2/v2-og-image.jpg">
  <meta name="twitter:title" content="{{ page.title }} — OpenPoleMount">
  <meta name="twitter:description" content="{{ config.site_description }}">
{% endblock %}
