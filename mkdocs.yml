site_name: OpenPoleMount
site_url: https://openpolemount.com
site_description: Open-source 3D-printable universal equipment cradle and open mounting standard for home IV poles
site_author: OpenPoleMount Contributors
repo_url: https://github.com/GoR-XarraY/openpolemount
repo_name: GoR-XarraY/openpolemount
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  palette:
    - scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.top
    - navigation.instant
    - search.highlight
    - content.action.edit
    - content.tooltips

nav:
  - Home: index.md
  - The Mounting Block (Project Foundation):
    - Overview: mounting-block/index.md
    - Bill of Materials: mounting-block/bom.md
    - Risk Analysis: mounting-block/risk-analysis.md
  - IV Pole Cradle — v3:
    - Overview & Photos: iv-pole-v3/index.md
    - Print It Yourself: iv-pole-v3/print-settings.md
    - Assembly: iv-pole-v3/assembly.md
    - Risk Analysis: iv-pole-v3/risk-analysis.md
    - Strength Testing: testing.md
  - IV Pole Cradle — v2 (Universal Holder):
    - Overview & Photos: iv-pole-v2/index.md
    - Print It Yourself: iv-pole-v2/print-settings.md
    - Assembly: iv-pole-v2/assembly.md
    - Risk Analysis: iv-pole-v2/risk-analysis.md
  - Cradle Bill of Materials: cradle-bom.md
  - No Printer? Order One: order.md
  - v1 — Accessory Box:
    - About v1: print-settings.md
    - v1 Assembly: assembly.md
    - Risk Analysis: v1-risk-analysis.md
  - Safety & Disclaimer: safety.md
  - Contribute: contributing.md
  - Accessories: accessories/index.md
  - License & Open Hardware: license.md

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - attr_list
  - md_in_html

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/GoR-XarraY/openpolemount
      name: GitHub

copyright: >
  Copyright &copy; 2026 OpenPoleMount Contributors —
  Hardware: <a href="https://cern-ohl.web.cern.ch/">CERN-OHL-W-2.0</a> |
  Docs: <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC-BY-SA-4.0</a>
